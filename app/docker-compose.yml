# Banco local de desenvolvimento. Credenciais apenas para uso local; nunca reutilizar em outro ambiente.
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: dev_root_local
      MYSQL_DATABASE: acai_conecta
      MYSQL_USER: acai
      MYSQL_PASSWORD: acai_local
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - acai_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdev_root_local"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  acai_db:
